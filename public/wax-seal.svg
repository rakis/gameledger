<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="waxGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#cf1b32" />
      <stop offset="60%" stop-color="#8b111e" />
      <stop offset="100%" stop-color="#4e070e" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Wax seal blob shape -->
  <path d="M50 5 C62 4, 70 12, 78 18 C88 25, 96 35, 94 48 C92 62, 85 70, 78 80 C70 90, 58 96, 46 95 C32 94, 22 88, 14 78 C6 68, 4 55, 6 42 C8 30, 15 18, 28 10 C38 3, 42 6, 50 5 Z" 
        fill="url(#waxGrad)" filter="url(#shadow)" stroke="#45050b" stroke-width="1.5" />
  <!-- Inner stamped rim -->
  <circle cx="50" cy="50" r="32" fill="none" stroke="#680b15" stroke-width="2.5" stroke-dasharray="4 2" />
  <!-- Monogram TM / G -->
  <text x="50" y="58" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="bold" fill="#f6e4b8" text-anchor="middle" letter-spacing="1">TM</text>
</svg>
